<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prototype Template — Supabase Persistence</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #2a2e38;
    --text: #e6e8ec;
    --muted: #8b90a0;
    --accent: #6c5ce7;
    --accent-hover: #7d6ff5;
    --ok: #2ecc71;
    --err: #e74c3c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    padding: 48px 20px;
  }
  .card {
    width: 100%;
    max-width: 480px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 28px;
  }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .subtitle { color: var(--muted); font-size: 13px; margin-bottom: 24px; }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  input[type="text"], textarea {
    width: 100%;
    background: #0f1115;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    padding: 10px 12px;
    font-size: 14px;
    font-family: inherit;
    margin-bottom: 16px;
  }
  textarea { min-height: 80px; resize: vertical; }
  .row { display: flex; gap: 10px; }
  button {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 10px 16px;
    font-size: 14px;
    cursor: pointer;
    font-weight: 500;
  }
  button:hover { background: var(--accent-hover); }
  button.secondary {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
  }
  button.secondary:hover { background: #1e222b; }
  #status {
    margin-top: 16px;
    font-size: 13px;
    min-height: 18px;
  }
  #status.ok { color: var(--ok); }
  #status.err { color: var(--err); }
  .demo-id-badge {
    display: inline-block;
    font-size: 11px;
    color: var(--muted);
    background: #0f1115;
    border: 1px solid var(--border);
    padding: 3px 8px;
    border-radius: 6px;
    margin-bottom: 20px;
  }
</style>
</head>
<body>

<div class="card">
  <h1>Prototype Notes Demo</h1>
  <div class="subtitle">Same UI you'd build for a client — but state now lives in Supabase instead of localStorage.</div>
  <div class="demo-id-badge" id="demoIdBadge">demo_id: loading…</div>

  <label for="noteInput">Client note (try refreshing the page after saving)</label>
  <textarea id="noteInput" placeholder="Type something and hit Save…"></textarea>

  <div class="row">
    <button id="saveBtn">Save</button>
    <button id="loadBtn" class="secondary">Reload from DB</button>
  </div>

  <div id="status"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // ─────────────────────────────────────────────────────────
  // 1. PLUG IN YOUR SUPABASE CREDENTIALS HERE
  //    (Project Settings → API in your Supabase dashboard)
  // ─────────────────────────────────────────────────────────
  const SUPABASE_URL = 'https://xoqrmymvhtomsgbcyliu.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhvcXJteW12aHRvbXNnYmN5bGl1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkwMzAxNzUsImV4cCI6MjEwNDYwNjE3NX0._kZLYLl9ojnZ9WblOg0ip3BBvikTBi-bZG6KmmcxRm0';

  // ─────────────────────────────────────────────────────────
  // 2. TABLE SETUP (run once in Supabase SQL editor, or use
  //    the Table Editor UI):
  //
  //    create table prototype_state (
  //      id bigint generated always as identity primary key,
  //      demo_id text unique,
  //      data jsonb,
  //      updated_at timestamp default now()
  //    );
  //
  //    alter table prototype_state enable row level security;
  //
  //    create policy "allow anon read/write"
  //      on prototype_state for all
  //      to anon
  //      using (true)
  //      with check (true);
  // ─────────────────────────────────────────────────────────

  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // Each client/demo gets its own row via demo_id.
  // Change this per deployment, or read it from the URL, e.g.:
  // const DEMO_ID = new URLSearchParams(location.search).get('client') || 'default';
  const DEMO_ID = 'default';

  const noteInput = document.getElementById('noteInput');
  const statusEl = document.getElementById('status');
  const demoIdBadge = document.getElementById('demoIdBadge');

  demoIdBadge.textContent = `demo_id: ${DEMO_ID}`;

  function setStatus(msg, type) {
    statusEl.textContent = msg;
    statusEl.className = type || '';
  }

  async function saveState() {
    setStatus('Saving…');
    const { error } = await supabase
      .from('prototype_state')
      .upsert({ demo_id: DEMO_ID, data: { note: noteInput.value } }, { onConflict: 'demo_id' });

    if (error) {
      console.error(error);
      setStatus(`Save failed: ${error.message}`, 'err');
    } else {
      setStatus('Saved ✓', 'ok');
    }
  }

  async function loadState() {
    setStatus('Loading…');
    const { data, error } = await supabase
      .from('prototype_state')
      .select('data')
      .eq('demo_id', DEMO_ID)
      .maybeSingle();

    if (error) {
      console.error(error);
      setStatus(`Load failed: ${error.message}`, 'err');
      return;
    }

    if (data && data.data && typeof data.data.note === 'string') {
      noteInput.value = data.data.note;
      setStatus('Loaded ✓', 'ok');
    } else {
      setStatus('No saved data yet — save something first.', '');
    }
  }

  document.getElementById('saveBtn').addEventListener('click', saveState);
  document.getElementById('loadBtn').addEventListener('click', loadState);

  // Auto-load on page open, so refreshing the page (or opening
  // it on a different device/browser) picks up the saved state.
  window.addEventListener('DOMContentLoaded', loadState);
</script>

</body>
</html>
